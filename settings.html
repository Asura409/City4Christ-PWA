<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5B2C83" />
    <title>City4Christ | Settings</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/connected.css" />
  </head>
  <body class="connected-page" data-connected-page="settings">
    <header class="connected-header">
      <a class="connected-brand" href="/#/home"
        ><img src="assets/images/logo.jpeg" alt="City4Christ" /><span
          >City4Christ</span
        ></a
      >
      <nav
        class="api-navigation"
        data-api-navigation
        aria-label="Connected preview features"
      >
        <a href="/#/home">Home</a><a href="word.html">Word Hub</a
        ><a href="members.html">Members</a><a href="profile.html">My profile</a
        ><a href="staff.html">Staff tools</a
        ><a href="auth.html" data-auth-link>Sign in</a>
      </nav>
    </header>
    <main class="connected-main">
      <p class="eyebrow">City4Christ preview</p>
      <h1>Settings</h1>
      <div
        id="page-status"
        class="status"
        role="status"
        aria-live="polite"
        tabindex="-1"
      ></div>
      <section id="profile-panel" class="panel" hidden>
        <p id="profile-email" class="muted"></p>
        <p class="account-id">Account ID: <span id="profile-id"></span></p>
        <form id="profile-form" aria-label="Edit profile">
          <div class="form-grid">
            <label
              >First name<input
                name="firstName"
                required
                maxlength="100"
                autocomplete="given-name" /></label
            ><label
              >Last name<input
                name="lastName"
                required
                maxlength="100"
                autocomplete="family-name" /></label
            ><label class="check-label full"
              ><input type="checkbox" name="directoryVisible" /><span
                >Show my name in the member directory<small class="muted">
                  Your email remains private. Leave this off to stay
                  hidden.</small
                ></span
              ></label
            >
          </div>
          <div class="actions"><button>Save profile</button></div>
        </form>
        <div class="actions">
          <button type="button" id="check-session" class="secondary">
            Check session</button
          ><button type="button" id="link-google" class="secondary">
            Link my Google account</button
          ><button type="button" data-logout class="secondary">Sign out</button>
        </div>
        <p class="muted">
          Google linking requires a recent sign-in and the same verified email.
        </p>
      </section>
      <section class="panel">
        <h2>Appearance</h2>
        <label
          >Theme on this device<select id="theme-selector">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select></label
        >
      </section>
      <section class="panel">
        <h2>Preview service</h2>
        <button type="button" id="check-health" class="secondary">
          Check connection
        </button>
      </section>
    </main>
    <footer class="connected-footer">
      A community growing in faith. Previewers: use test information only.
    </footer>
    <script src="js/app.js"></script>
    <script src="js/config.js"></script>
    <script type="module" src="js/connected.js"></script>
  </body>
</html>
