# Add this to the preview.city4christ.org CyberPanel vHost Conf.
# Do not replace the existing docRoot, SSL, or rewrite blocks.
#
# CyberPanel path:
#   /usr/local/lsws/conf/vhosts/preview.city4christ.org/vhconf.conf
#
# The API container must already listen on 127.0.0.1:3000.

extprocessor city4christ_api {
  type proxy
  address 127.0.0.1:3000
  maxConns 100
  pcKeepAliveTimeout 60
  initTimeout 60
  retryTimeout 0
  respBuffer 0
}

context /api/ {
  type proxy
  handler city4christ_api
  addDefaultCharset off
  allowBrowse 0
}

context /health/ {
  type proxy
  handler city4christ_api
  addDefaultCharset off
  allowBrowse 0
}
