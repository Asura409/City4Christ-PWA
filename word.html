<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5B2C83" />
    <title>City4Christ | Word Hub</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/connected.css" />
  </head>
  <body class="connected-page" data-connected-page="word">
    <header class="connected-header">
      <a class="connected-brand" href="/#/home"
        ><img src="assets/images/logo.jpeg" alt="City4Christ" /><span
          >City4Christ</span
        ></a
      >
      <nav
        class="api-navigation"
        data-api-navigation
        aria-label="Connected preview features"
      >
        <a href="/#/home">Home</a><a href="word.html">Word Hub</a
        ><a href="members.html">Members</a><a href="profile.html">My profile</a
        ><a href="staff.html">Staff tools</a
        ><a href="auth.html" data-auth-link>Sign in</a>
      </nav>
    </header>
    <main class="connected-main">
      <p class="eyebrow">City4Christ preview</p>
      <h1>Word Hub</h1>
      <div
        id="page-status"
        class="status"
        role="status"
        aria-live="polite"
        tabindex="-1"
      ></div>
      <p class="muted">
        Explore published sermons and teaching from City4Christ.
      </p>
      <form id="sermon-search" aria-label="Search sermons" class="panel">
        <div class="form-grid">
          <label class="full"
            >Search sermons<input
              name="query"
              type="search"
              maxlength="200"
              placeholder="Title or summary" /></label
          ><label>Speaker<input name="speaker" maxlength="200" /></label
          ><label>Series<input name="series" maxlength="200" /></label
          ><label>Topic<input name="topic" maxlength="100" /></label>
        </div>
        <div class="actions"><button>Search sermons</button></div>
      </form>
      <div id="sermon-results" class="list-grid" aria-live="polite"></div>
      <div class="actions">
        <button id="sermon-more" type="button" class="secondary" hidden>
          Load more sermons
        </button>
      </div>
      <section id="sermon-detail" class="panel" hidden>
        <a href="word.html">Back to sermons</a>
        <div id="sermon-detail-content"></div>
      </section>
    </main>
    <footer class="connected-footer">
      A community growing in faith. Previewers: use test information only.
    </footer>
    <script src="js/app.js"></script>
    <script src="js/config.js"></script>
    <script type="module" src="js/connected.js"></script>
  </body>
</html>
