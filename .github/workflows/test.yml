name: Frontend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test API client, build configuration and cache privacy
        run: npm test
      - name: Build canonical frontend
        run: npm run build
        env:
          API_URL: /
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile preview workflows
        run: npm run test:browser -- tests/browser/preview.spec.mjs tests/browser/access.spec.mjs tests/browser/react.spec.mjs
