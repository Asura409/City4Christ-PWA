name: Frontend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test API client, build configuration and cache privacy
        run: npm test
      - name: Build canonical frontend
        run: npm run build
        env:
          API_URL: /
          # Synthetic storage host intercepted by browser tests; no live upload.
          MEDIA_ORIGIN: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile preview workflows
        run: npm run test:browser -- tests/browser/preview.spec.mjs tests/browser/access.spec.mjs tests/browser/react.spec.mjs tests/browser/reauthentication.spec.mjs tests/browser/mfa.spec.mjs tests/browser/church-roles.spec.mjs tests/browser/google-react.spec.mjs tests/browser/pastoral.spec.mjs tests/browser/pastoral-listing.spec.mjs tests/browser/devotionals.spec.mjs tests/browser/dailyverse.spec.mjs tests/browser/bible.spec.mjs tests/browser/groups.spec.mjs tests/browser/group-content.spec.mjs tests/browser/notifications.spec.mjs tests/browser/notification-settings.spec.mjs tests/browser/events.spec.mjs tests/browser/posts.spec.mjs
