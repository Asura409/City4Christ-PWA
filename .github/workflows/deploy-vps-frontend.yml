name: Deploy frontend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps-preview
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PATH: ${{ vars.VPS_PATH || '/home/pwa.city4christ.org' }}
      MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build static frontend
        run: API_URL=/ MEDIA_ORIGIN="$MEDIA_ORIGIN" npm run build

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          release_path="$VPS_PATH/releases/$RELEASE"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$release_path'"
          rsync -az --delete dist/ "$VPS_USER@$VPS_HOST:$release_path/"

          # Keep old hashed assets reachable for tabs opened before this deploy.
          ssh "$VPS_USER@$VPS_HOST" \
            "if [ -d '$VPS_PATH/current/app-assets' ]; then rsync -a '$VPS_PATH/current/app-assets/' '$release_path/app-assets/'; fi"

          # The docroot follows public_html -> current, so this switch is atomic.
          ssh "$VPS_USER@$VPS_HOST" \
            "ln -sfn '$release_path' '$VPS_PATH/current'"
